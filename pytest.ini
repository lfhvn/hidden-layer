[pytest]
# Pytest configuration for Hidden Layer

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    # importlib mode lets suites in different dirs share test-file basenames
    # (e.g. tests/test_core.py and communication/multi-agent/tests/test_core.py).
    --import-mode=importlib

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (may take a while)
    benchmark: Benchmark tests

# Minimum Python version
minversion = 3.8
