<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

    --wood: #232b1c; --woodline: #3d4c32;

    --leaf: #4d7a3c; --sun: #c98f2b; --heart: #b05a4a;

  * { box-sizing: border-box; margin: 0; padding: 0; }

    opacity: 0.07; mix-blend-mode: overlay;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 91; pointer-events: none;

  .spacer { flex: 1; }
  header button {
    background: #2b3622; border: 1px solid var(--woodline); border-radius: 8px;

  }
  header button:hover { border-color: #c98f2b; }

  .surplus { color: #e9b44c; font-weight: 700; font-variant-numeric: tabular-nums; }

  aside {

<script>
"use strict";
/* ============================================================
 * Kernel — JS port of collective-intelligence/guild/guild/
 * kernel.py including the optional culture primitives
 * (mentorship spillover, tradition ratchet), here switched on.
 * ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CRAFTS = [
  { name: "Foraging",     icon: "🌾", person: "forager" },
  { name: "Fishing",      icon: "🎣", person: "fisher" },
  { name: "Healing",      icon: "🌿", person: "healer" },
  { name: "Carpentry",    icon: "🪚", person: "carpenter" },
  { name: "Weaving",      icon: "🧶", person: "weaver" },
  { name: "Keeping",      icon: "🐝", person: "keeper" },
  { name: "Cooking",      icon: "🍲", person: "cook" },
  { name: "Storytelling", icon: "📖", person: "storyteller" },
  { name: "Wayfinding",   icon: "🧭", person: "wayfinder" },
  { name: "Claywork",     icon: "🏺", person: "potter" },
];
const CRAFT_HUE = i => (i * 360 / CRAFTS.length + 15) % 360;

const NEEDS = [
  ["First greens at {P}", "The berry thickets of {P}"],
  ["The fish run below {P}", "Set the night-lines at {P}"],
  ["Fever in {P}", "A hard birth at {P}"],
  ["Mend the weir at {P}", "Shore up the bridge by {P}"],
  ["Winter cloth for {P}", "New nets for {P}"],
  ["The hives at {P} are restless", "Lambing at {P}"],
  ["Lay in stores at {P}", "The gathering feast at {P}"],
  ["A quarrel to settle in {P}", "Long-night vigil at {P}"],
  ["A traveler lost near {P}", "Blaze a path to {P}"],
  ["New vessels for {P}", "Reline the spring at {P}"],
];
const PLACES = ["Reedmarsh","Alder Hollow","the ford","the high meadow","the old cedar","the winter store","the east huts","Foxglove Bank"];
const SEASONS = [
  { name: "Spring", icon: "🌱", wants: [0, 2], diff: 0.55, note: "First growth and spring fevers — the valley wants foragers and healers." },
  { name: "Summer", icon: "☀️", wants: [1, 8], diff: 0.55, note: "Long days and far paths — the valley wants fishers and wayfinders." },
  { name: "Autumn", icon: "🍂", wants: [6, 4], diff: 0.55, note: "Preserving and mending — the valley wants cooks and weavers." },
  { name: "Winter", icon: "❄️", wants: [3, 7], diff: 0.68, note: "The hard season. Repairs and long nights — carpenters and storytellers, if you have them." },
];
const SEASON_LEN = 28, YEAR_LEN = 112;

const NAMES = ["Sela","Bram","Osric","Wren","Petra","Aldous","Mira","Finn","Edda","Jori","Tilda","Nils","Rosa","Kell","Doro","Hale","Isolde","Quinn","Sten","Vera","Willa","Yorick","Cass","Lina","Greta","Piper","Ulf","Anselm","Berry","Moss","Hazel","Corin","Fen","Iris","Tam"];
const QUIRKS = [
  "counts the geese every dusk","hums while she works","never sits with his back to the door",
  "keeps a pebble from every place she's been","talks to the river","remembers everyone's birthday",
  "won't eat before the others do","whittles little boats","laughs at her own jokes",
  "swears the old cedar listens","mends things nobody asked her to","walks the fences at dawn",
  "always knows when rain is coming","saves the last bite for the dogs","writes letters he never sends",
  "names the bees","sings off-key with great conviction","keeps her tools sharper than her tongue",
  "collects odd-shaped spoons","never crosses the ford dry-shod","tells the same story differently each time",
  "sleeps outdoors till first frost","braids grass while thinking","greets the moon like an old friend",
  "hoards seeds in coat pockets","whistles back at kestrels","measures twice, cuts once, checks again",
  "leaves berries on stumps for 'whoever'","claims to have seen the marsh-light twice","keeps yesterday's bread for the ducks",
  "draws maps of places she's never been","stacks stones wherever he waits","waves at every passing bird",
  "sharpens the same knife every evening","knows all the shallow places by heart",
];
const CIRCLE_WORDS = ["Alder","Reed","Cedar","Fern","Heron","Otter","Bramble","Moss","Kestrel","Willow","Aspen","Tern"];
const LEVELS = [
  { min: 0.80, stars: "★★★★★" }, { min: 0.60, stars: "★★★★" }, { min: 0.45, stars: "★★★" },
  { min: 0.30, stars: "★★" }, { min: 0.00, stars: "★" },
];
const TIERS = [
  { at: 0, label: "A Camp" }, { at: 15, label: "A Hamlet" }, { at: 40, label: "A Village" },
  { at: 90, label: "A Township" }, { at: 180, label: "A Heartland" },
];

const DEFAULTS = {
  nLoci: 24, nSkills: 10, teamSize: 3, difficulty: 0.55,
  initialSkill: 0.25, skillJitter: 0.05, learningRate: 0.2,
  skillDecay: 0.005, bondGain: 1.0, bondDecay: 0.01, exploration: 0.05,
  mentorship: 0.04, mentorThreshold: 0.7,
  traditionExperts: 4, traditionLevel: 0.8, traditionFloor: 0.4,
  reinforcement: true, practice: true, seed: 3,
};

class Kernel {
  constructor(cfg) {
    this.cfg = { ...DEFAULTS, ...cfg };
    this.rng = mulberry32(this.cfg.seed);
    this.skills = []; this.bonds = [];
    this.active = new Set();
    this.taskBias = new Set();
    this.seasonBias = new Set();
    this.traditions = new Set();
    for (let i = 0; i < this.cfg.nLoci; i++) this.addLocus();
    this.round = 0;
    this.recent = [];
    this.trainingUntil = 0;
  }
  addLocus() {
    const c = this.cfg, v = [];
    for (let k = 0; k < c.nSkills; k++) {
      const base = this.traditions.has(k) ? c.traditionFloor : c.initialSkill;
      v.push(Math.min(1, Math.max(0, base + (this.rng() * 2 - 1) * c.skillJitter)));
    }
    const i = this.skills.length;
    this.skills.push(v);
    this.bonds.push(new Map());
    this.active.add(i);
    return i;
  }
  removeLocus(i) {
    this.active.delete(i);
    this.bonds[i].clear();
    for (const m of this.bonds) m.delete(i);
  }
  activeList() { return [...this.active]; }
  weightedPick(items, weights) {
    let total = 0;
    for (const w of weights) total += w;
    let r = this.rng() * total;
    for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }
  sampleTask() {
    const c = this.cfg, pool = [], weights = [];
    for (let k = 0; k < c.nSkills; k++) {
      pool.push(k);
      weights.push(1 + (this.taskBias.has(k) ? 4 : 0) + (this.seasonBias.has(k) ? 2 : 0));
    }
    const req = [];
    while (req.length < c.teamSize) {
      const k = this.weightedPick(pool, weights);
      if (!req.includes(k)) req.push(k);
    }
    req.sort((a, b) => a - b);
    return req;
  }
  recruit() {
    const c = this.cfg, act = this.activeList();
    const team = [act[Math.floor(this.rng() * act.length)]];
    while (team.length < c.teamSize) {
      const cand = [], weights = [];
      for (const j of act) {
        if (team.includes(j)) continue;
        cand.push(j);
        if (c.reinforcement) {
          let w = c.exploration;
          for (const m of team) w += (this.bonds[m].get(j) || 0);
          weights.push(w);
        } else weights.push(1);
      }
      team.push(this.weightedPick(cand, weights));
    }
    return team;
  }
  step() {
    const c = this.cfg;
    const req = this.sampleTask();
    const team = this.recruit();
    const coverage = req.map(k => {
      let best = team[0];
      for (const m of team) if (this.skills[m][k] > this.skills[best][k]) best = m;
      return [k, best];
    });
    let p = 1;
    for (const [k, m] of coverage) { const s = this.skills[m][k]; p *= s / (s + c.difficulty); }
    const success = this.rng() < p;

    const training = this.round < this.trainingUntil;
    const practiceActive = c.practice || training;
    const lr = (c.practice && training) ? c.learningRate * 2 : c.learningRate;
    if (practiceActive) {
      for (const [k, m] of coverage) {
        const s = this.skills[m][k];
        this.skills[m][k] = s + lr * (1 - s);
      }
      // mentorship: working beside an expert teaches
      if (c.mentorship > 0) {
        for (const [k, m] of coverage) {
          const master = this.skills[m][k];
          if (master >= c.mentorThreshold) {
            for (const other of team) {
              const s = this.skills[other][k];
              if (other !== m && s < master) this.skills[other][k] = s + c.mentorship * (master - s);
            }
          }
        }
      }
    }
    if (success) {
      for (const i of team) for (const j of team) if (i !== j) {
        this.bonds[i].set(j, (this.bonds[i].get(j) || 0) + c.bondGain);
      }
    }
    // tradition ratchet: enough simultaneous experts -> the craft belongs to the valley
    if (c.traditionExperts > 0) {
      for (let k = 0; k < c.nSkills; k++) {
        if (this.traditions.has(k)) continue;
        let experts = 0;
        for (const i of this.active) if (this.skills[i][k] >= c.traditionLevel) experts++;
        if (experts >= c.traditionExperts) this.traditions.add(k);
      }
    }
    if (practiceActive && c.skillDecay > 0) {
      const keep = 1 - c.skillDecay;
      for (const i of this.active) {
        const v = this.skills[i];
        for (let k = 0; k < c.nSkills; k++) {
          const base = this.traditions.has(k) ? c.traditionFloor : c.initialSkill;
          if (v[k] > base) v[k] = base + (v[k] - base) * keep;
          else if (this.traditions.has(k) && v[k] < base) v[k] = Math.min(base, v[k] + c.skillDecay * (base - v[k]) * 4);
        }
      }
    }
    const bd = 1 - c.bondDecay;
    for (const m of this.bonds) for (const [j, w] of m) {
      const nw = w * bd;
      if (nw < 1e-6) m.delete(j); else m.set(j, nw);
    }
    const ev = { round: this.round, team: [...team].sort((a, b) => a - b), req, coverage, success, p };
    this.recent.push(ev);
    if (this.recent.length > 300) this.recent.shift();
    this.round++;
    return ev;
  }
}

/* ---- research detectors ---- */
function specialization(skills, active) {
  const idx = active ? [...active] : skills.map((_, i) => i);
  if (!idx.length) return 0;
  const K = skills[0].length; let total = 0;
  for (const i of idx) {
    const v = skills[i];
    const floor = Math.min(...v);
    const ex = v.map(s => s - floor);
    const mass = ex.reduce((a, b) => a + b, 0);
    if (mass <= 1e-9) continue;
    let H = 0;
    for (const e of ex) { const q = e / mass; if (q > 0) H -= q * Math.log(q); }
    total += 1 - H / Math.log(K);
  }
  return total / idx.length;
}
function successRate(events) {
  if (!events.length) return 0;
  return events.filter(e => e.success).length / events.length;
}
function teamRecurrence(events) {
  if (!events.length) return 0;
  const counts = new Map();
  for (const e of events) { const k = e.team.join(","); counts.set(k, (counts.get(k) || 0) + 1); }
  let rep = 0;
  for (const c of counts.values()) if (c >= 2) rep += c;
  return rep / events.length;
}

/* ============================================================
 * The run: one clearing, one succession story.
 * Win = the Closing. Loss = the Exodus. Leaving is allowed.
 * ============================================================ */
const CLOSING = { minYear: 3, traditions: 6, success: 0.14, hands: 2 };
const EXODUS_FLOOR = 6;

class Game {
  constructor(seed) {
    this.kernel = new Kernel({ seed });
    this.flavorRng = mulberry32(seed + 999);
    this.villagers = [];
    for (let i = 0; i < this.kernel.skills.length; i++) this.addVillager();
    this.surplus = 30;
    this.flourish = 0;
    this.tierIdx = 0;
    this.crews = new Map();
    this.log = [];
    this.milestones = new Set();
    this.flashes = [];
    this.today = null;
    this.season = -1;
    this.hands = [];            // rounds when the steward acted
    this.departedCount = 0;
    this.over = null;           // null | 'closing' | 'exodus' | 'leave'
    this.closed = false;
    this.note(0, "You are the steward of a small commons — a few huts, a river, and two dozen people who barely know each other. You cannot tell anyone what to do. You can only watch, and tend. They say a valley is truly settled when it no longer needs its steward.", "milestone");
    this.applySeason();
  }
  addVillager() {
    const i = this.villagers.length;
    this.villagers.push({
      name: NAMES[i % NAMES.length] + (i >= NAMES.length ? " II" : ""),
      quirk: QUIRKS[Math.floor(this.flavorRng() * QUIRKS.length)],
      works: 0, carried: 0, departed: false,
    });
    return i;
  }
  vname(i) { return this.villagers[i].name; }
  note(day, html, cls) {
    this.log.unshift({ day, html, cls });
    if (this.log.length > 100) this.log.pop();
    this.logDirty = true;
  }
  spend(cost) {
    if (this.surplus < cost) return false;
    this.surplus -= cost;
    return true;
  }
  recordHand() { this.hands.push(this.kernel.round); }
  handsInYear() { return this.hands.filter(r => r > this.kernel.round - YEAR_LEN).length; }
  year() { return Math.floor(this.kernel.round / YEAR_LEN) + 1; }
  expectation() {
    const y = this.year();
    return y <= 1 ? 0 : Math.min(0.16, 0.08 + 0.02 * (y - 1));
  }
  dateParts(day) {
    const season = Math.floor(day / SEASON_LEN) % 4;
    return { season, dayOfSeason: (day % SEASON_LEN) + 1, year: Math.floor(day / YEAR_LEN) + 1 };
  }
  applySeason() {
    const s = this.dateParts(this.kernel.round).season;
    if (s === this.season) return;
    this.season = s;
    this.kernel.seasonBias = new Set(SEASONS[s].wants);
    this.kernel.cfg.difficulty = SEASONS[s].diff;
    if (this.kernel.round > 0) {
      this.note(this.kernel.round, `${SEASONS[s].icon} ${SEASONS[s].name} comes to the valley. ${SEASONS[s].note}`, "milestone");
    }
  }
  inLivingCircle(i) {
    for (const [key, c] of this.crews) {
      if (c.name && !c.disbanded && this.kernel.round - c.lastSeen < 300 &&
          key.split(",").map(Number).includes(i)) return true;
    }
    return false;
  }
  anchor(i) {
    let total = 0;
    for (const [, w] of this.kernel.bonds[i]) total += w;
    for (const j of this.kernel.active) { const w = this.kernel.bonds[j].get(i); if (w) total += w; }
    return Math.min(1, total / 8);
  }
  seasonTick() {
    const k = this.kernel;
    const succ = successRate(k.recent.slice(-100));
    const e = this.expectation();
    // hard seasons pull people away; companionship and circles hold them
    const shortfall = Math.max(0, e - succ);
    if (shortfall > 0 && !this.over) {
      let leaves = 0;
      const reasons = ["has gone over the pass, looking for kinder country",
                       "took the river road south before first light",
                       "went back to their mother's people",
                       "left with a passing trader, and few could blame them"];
      for (const i of k.activeList()) {
        if (leaves >= 3) break;
        if (this.inLivingCircle(i)) continue;
        const p = Math.min(0.35, shortfall * 2.5) * (1 - this.anchor(i));
        if (this.flavorRng() < p) {
          k.removeLocus(i);
          this.villagers[i].departed = true;
          this.departedCount++; leaves++;
          this.note(k.round, `${this.vname(i)} ${reasons[Math.floor(this.flavorRng() * reasons.length)]}.`, "warn");
        }
      }
      if (leaves && k.active.size < 10) {
        this.note(k.round, `The valley is thinning. ${k.active.size} souls remain.`, "warn");
      }
    }
    if (k.active.size < EXODUS_FLOOR && !this.over) return this.end("exodus");
    // the Closing
    if (!this.closed && !this.over && this.year() > CLOSING.minYear) {
      const yearSucc = successRate(k.recent.slice(-YEAR_LEN));
      const handsY = this.handsInYear();
      const conds = {
        traditions: k.traditions.size >= CLOSING.traditions,
        success: yearSucc >= CLOSING.success,
        hands: handsY <= CLOSING.hands,
        calls: k.taskBias.size === 0,
      };
      if (Object.values(conds).every(Boolean)) return this.end("closing");
      const hintKey = "hint" + this.year();
      if (conds.traditions && !this.milestones.has(hintKey)) {
        this.milestones.add(hintKey);
        if (!conds.calls) this.note(k.round, `The valley hardly needs its steward — but your calls still hang on the post. Take them down; let it choose its own work.`);
        else if (!conds.hands) this.note(k.round, `The valley is nearly itself. It lacks only your absence — you lent a hand ${handsY} times this year.`);
      }
    }
  }
  needTitle(req) {
    const primary = req[Math.floor(this.flavorRng() * req.length)];
    const t = NEEDS[primary][Math.floor(this.flavorRng() * NEEDS[primary].length)];
    return t.replace("{P}", PLACES[Math.floor(this.flavorRng() * PLACES.length)]);
  }
  crewName(key) {
    const c = this.crews.get(key);
    return c && c.name ? `<span class="circle">${c.name}</span>` : null;
  }
  day() {
    if (this.over) return;
    const k = this.kernel;
    if (k.round > 0 && k.round % SEASON_LEN === 0) {
      this.seasonTick();
      if (this.over) return;
    }
    this.applySeason();
    const beforeTrads = k.traditions.size;
    const ev = k.step();
    if (k.round % 40 === 0) this.surplus = Math.min(99, this.surplus + 1);

    if (k.traditions.size > beforeTrads) {
      for (const t of k.traditions) {
        if (!this.milestones.has("trad" + t)) {
          this.milestones.add("trad" + t);
          this.note(ev.round, `${CRAFTS[t].icon} ${CRAFTS[t].name} has become a tradition of the valley — the knowing of it lives in the place now, not in any one pair of hands.`, "milestone");
          this.glitch = true;
        }
      }
    }

    const icons = ev.req.map(s => CRAFTS[s].icon).join("");
    const needTitle = this.needTitle(ev.req);
    const partyNames = ev.team.map(i => this.vname(i));
    let best = ev.coverage[0], worst = ev.coverage[0];
    const strength = ([s, m]) => k.skills[m][s];
    for (const c of ev.coverage) {
      if (strength(c) > strength(best)) best = c;
      if (strength(c) < strength(worst)) worst = c;
    }
    let outcome;
    if (ev.success) {
      this.surplus = Math.min(99, this.surplus + 5); this.flourish += 1;
      outcome = `done — ${this.vname(best[1])}'s ${CRAFTS[best[0]].name.toLowerCase()} carried the day. <span class="ok">+5🧺</span>`;
      this.villagers[best[1]].carried++;
      this.flashes.push({ team: ev.team, t: 1 });
    } else {
      outcome = `it went badly — <span class="no">no real ${CRAFTS[worst[0]].person} among them</span>.`;
      this.flashes.push({ team: ev.team, t: 1, fail: true });
    }
    if (this.flashes.length > 6) this.flashes.shift();
    for (const i of ev.team) this.villagers[i].works++;
    // the day's work happens somewhere: the party walks there
    this.today = {
      title: needTitle, icons, partyNames, outcome, team: ev.team,
      site: { x: 0.08 + this.flavorRng() * 0.84, y: 0.55 + this.flavorRng() * 0.30 },
    };

    const key = ev.team.join(",");
    let crew = this.crews.get(key);
    if (!crew) { crew = { count: 0, wins: 0, name: null, lastSeen: 0 }; this.crews.set(key, crew); }
    crew.count++; crew.lastSeen = ev.round;
    if (ev.success) {
      crew.wins++;
      if (!this.milestones.has("first")) {
        this.milestones.add("first");
        this.note(ev.round, `${partyNames.join(", ")} came back singing — the valley's first real success.`, "milestone");
      }
      if (crew.wins === 5 && !crew.name) {
        crew.name = "The " + CIRCLE_WORDS[Math.floor(this.flavorRng() * CIRCLE_WORDS.length)] + " Circle";
        this.note(ev.round, `${partyNames.join(", ")} have worked side by side through five good days. People have started calling them <span class="circle">${crew.name}</span>.`, "milestone");
      }
    }
    if (ev.round % 100 === 0) this.periodic();
  }
  periodic() {
    const k = this.kernel;
    for (const [key, c] of this.crews) {
      if (c.name && !c.disbanded && k.round - c.lastSeen > 500) {
        c.disbanded = true;
        this.note(k.round, `No one has seen ${this.crewName(key)} work together in months. Quietly, it seems, they've gone their own ways.`, "warn");
      }
    }
    while (this.tierIdx + 1 < TIERS.length && this.flourish >= TIERS[this.tierIdx + 1].at) {
      this.tierIdx++;
      this.note(k.round, `The valley has grown. Travelers now speak of ${TIERS[this.tierIdx].label.toLowerCase()} by the river.`, "milestone");
    }
    if (!this.milestones.has("niche") && specialization(k.skills, k.active) > 0.15) {
      this.milestones.add("niche");
      this.note(k.round, `The valley is finding its niches — people are settling into livelihoods of their own.`, "milestone");
    }
    const win = k.recent.slice(-100);
    if (teamRecurrence(win) > 0.45 && successRate(win) < 0.12 && k.round > 400 && !this.milestones.has("habit" + Math.floor(k.round / 800))) {
      this.milestones.add("habit" + Math.floor(k.round / 800));
      this.note(k.round, `The same few answer every call, and it keeps going badly. Old habits are starving new growth — perhaps someone needs space.`, "warn");
    }
  }
  end(kind) {
    this.over = kind;
    if (kind === "closing") this.closed = true;
    this.overDirty = true;
  }
  elegy() {
    const k = this.kernel;
    const y = this.year(), remaining = k.active.size;
    const circles = [...this.crews.values()].filter(c => c.name).map(c => c.name);
    const trads = [...k.traditions].map(t => CRAFTS[t].icon).join(" ") || "none";
    const elders = k.activeList().filter(i => Math.max(...k.skills[i]) >= 0.8).length;
    return `You kept this valley for <b>${y} year${y > 1 ? "s" : ""}</b>.<br>` +
      `<b>${remaining}</b> souls remain; <b>${this.departedCount}</b> walked away. ` +
      `<b>${elders}</b> became elders of their craft.<br>` +
      `Circles founded: <b>${circles.length ? circles.join(", ") : "none"}</b>.<br>` +
      `Traditions of the valley: ${trads}.<br>` +
      `In all that time, they needed your hand <b>${this.hands.length}</b> times — ` +
      `${TIERS[this.tierIdx].label.toLowerCase()} stands by the river.`;
  }
  /* ------- steward's actions ------- */
  shareHearth(i, j) {
    if (!this.spend(10)) return false;
    this.kernel.bonds[i].set(j, (this.kernel.bonds[i].get(j) || 0) + 6);
    this.kernel.bonds[j].set(i, (this.kernel.bonds[j].get(i) || 0) + 6);
    this.recordHand();
    this.note(this.kernel.round, `You seat ${this.vname(i)} and ${this.vname(j)} at the same fire, and keep the stew coming.`);
    return true;
  }
  giveSpace(i, j) {
    if (!this.spend(8)) return false;
    this.kernel.bonds[i].delete(j);
    this.kernel.bonds[j].delete(i);
    this.recordHand();
    this.note(this.kernel.round, `You find reasons for ${this.vname(i)} and ${this.vname(j)} to work apart for a while.`);
    return true;
  }
  toggleCall(skill) {
    const bias = this.kernel.taskBias;
    if (bias.has(skill)) {
      bias.delete(skill);
      this.note(this.kernel.round, `You take down the standing call for ${CRAFTS[skill].name.toLowerCase()}.`);
      return true;
    }
    if (!this.spend(8)) return false;
    bias.add(skill);
    this.recordHand();
    this.note(this.kernel.round, `You raise a standing call: the valley has need of ${CRAFTS[skill].name.toLowerCase()}.`);
    return true;
  }
  teachingSeason() {
    if (!this.spend(30)) return false;
    this.kernel.trainingUntil = this.kernel.round + 150;
    this.recordHand();
    this.note(this.kernel.round, `You set aside surplus for a teaching season — elders hold workshops, and for a while everyone learns faster.`);
    return true;
  }
  welcome() {
    if (!this.spend(45)) return false;
    this.kernel.addLocus();
    const i = this.addVillager();
    this.recordHand();
    this.note(this.kernel.round, `A newcomer walks down the valley road with everything they own. ${this.vname(i)} — ${this.villagers[i].quirk}.`, "milestone");
    return i;
  }
}

/* ============================================================
 * Renderer — the painted valley, golden hour.
 * Lo-fi solarpunk: atmospheric-perspective ridges with stamped
 * foliage, god-rays, drifting motes, a great lantern-tree,
 * glass-roofed huts. Characters are outlined, shaded pixel
 * sprites (two hairstyles, six hair colors, four skins,
 * craft-dyed two-tone tunics) with pixel bust portraits in the
 * field-note cards. Glitch appears only when the data layer
 * surfaces.
 * ============================================================ */
const HAIR = ["#3e2f20","#6e4423","#c19a45","#221d18","#a8a091","#96471f"];
const SKIN = ["#f2cfa5","#dcae7e","#b57f55","#8e6040"];
const OUT = "#332a1e", EYE = "#241f19", BELT = "#4a3826";
const PXS = 3;

const HEAD_SHORT = [
  "....OOOO....",
  "...OHHHHO...",
  "..OHHHHHHO..",
  "..OHSSSSHO..",
  "..OSESSESO..",
  "..OSSSSSSO..",
  "...OSSSSO...",
  "....OSSO....",
];
const HEAD_LONG = [
  "....OOOO....",
  "...OHHHHO...",
  "..OHHHHHHO..",
  ".OHHSSSSHHO.",
  ".OHSESSESHO.",
  ".OHSSSSSSHO.",
  ".OHOSSSSOHO.",
  "..O.OSSO.O..",
];
const BODY_A = [
  "...OTTTTUO..",
  "..OTTTTTUUO.",
  ".OSTTTTTUSO.",
  "..OTTTTTUUO.",
  "..OTBBBBUUO.",
  "...OTTTTUO..",
  "...OLL.LLO..",
  "...OLL.LLO..",
  "...OBB.BBO..",
];
const BODY_B = [
  "...OTTTTUO..",
  "..OTTTTTUUO.",
  ".OSTTTTTUSO.",
  "..OTTTTTUUO.",
  "..OTBBBBUUO.",
  "...OTTTTUO..",
  "..OLL...LLO.",
  "..OLL...LLO.",
  "..OBB...BBO.",
];
const HUT = [
  ".....OO......",
  "....OGGO.....",
  "..OGGGGGGO...",
  ".OGWGGGGGWGO.",
  "OGGGGWGGGGGO.",
  "OOOOOOOOOOOO.",
  ".OWWWYYWWDDO.",
  ".OWYYWWWWDDO.",
  ".OWWWWWWWDDO.",
  ".OOOOOOOOOOO.",
];
const HUT_COLORS = { O: OUT, G: "#5f8f84", W: "#e4d6b4", Y: "#f4d98a", D: "#6a4a30" };

function paintPattern(rows, colorOf, scale) {
  const c = document.createElement("canvas");
  c.width = rows[0].length * scale; c.height = rows.length * scale;
  const g = c.getContext("2d");
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      if (ch === "." || ch === " ") continue;
      const col = colorOf(ch);
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}

/* Golden-hour seasonal grades. Each season: sky top, sky horizon,
 * ridge colors far->near, meadow top/bottom, canopy stamp pair, river. */
const PAL = [
  { skyT:"#7fa8ac", skyH:"#f2dcae", ridges:["#b8bfa0","#9aab80","#7e9766","#688259"],
    meadT:"#8fa163", meadB:"#5f7546", canA:"#5c8a4e", canB:"#79a562", river:"#c9d6b8",
    bloom:"rgba(255,224,160,0.14)" },
  { skyT:"#6f9fb0", skyH:"#f6dfa2", ridges:["#bcbe96","#a0ac78","#859862","#6f8754"],
    meadT:"#a2ab60", meadB:"#6d7d44", canA:"#587f42", canB:"#7fa050", river:"#d2dcb4",
    bloom:"rgba(255,214,140,0.17)" },
  { skyT:"#8f9aa0", skyH:"#efc898", ridges:["#bfb290","#a99a70","#95815a","#7d6b4a"],
    meadT:"#a8935b", meadB:"#77653e", canA:"#a06a34", canB:"#bd8a42", river:"#cfd2ae",
    bloom:"rgba(255,200,130,0.16)" },
  { skyT:"#93a3ad", skyH:"#e8e3d2", ridges:["#c3c8bd","#adb5a8","#98a294","#848f82",],
    meadT:"#b4bba6", meadB:"#87927c", canA:"#7c8a72", canB:"#95a389", river:"#dde3d6",
    bloom:"rgba(240,240,225,0.12)" },
];

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.pos = []; this.vel = [];
    this.layoutRng = mulberry32(42);
    this.bg = null; this.bgKey = "";
    this.spriteCache = new Map();
    this.hutSprite = paintPattern(HUT, ch => HUT_COLORS[ch], PXS);
    this.hutSlots = [[-0.13,-0.01],[0.10,-0.02],[-0.04,-0.05],[0.17,0.01],[-0.19,0.01],[0.04,-0.08],[-0.10,-0.09],[0.145,-0.07],[0.0,0.025]];
    this.clouds = [{x:0.12,y:0.07,s:1},{x:0.5,y:0.13,s:0.65},{x:0.82,y:0.05,s:1.25}];
    this.motes = Array.from({length: 42}, (_, m) => ({
      x: (m * 0.618) % 1, y: 0.15 + ((m * 0.377) % 1) * 0.7, p: m * 1.31,
    }));
    this.smoke = [];
    this.glitchFrames = 0;
    this.lastPx = [];
    this.facing = [];
  }
  syncNodes(n) {
    while (this.pos.length < n) {
      const a = this.layoutRng() * Math.PI * 2, r = 0.15 + this.layoutRng() * 0.14;
      this.pos.push([0.5 + Math.cos(a) * r * 1.6, 0.68 + Math.sin(a) * r]);
      this.vel.push([0, 0]);
      this.lastPx.push([0, 0]);
      this.facing.push(1);
    }
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = this.canvas.getBoundingClientRect();
    this.canvas.width = r.width * dpr; this.canvas.height = r.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.imageSmoothingEnabled = false;
    this.w = r.width; this.h = r.height;
    this.bgKey = "";
  }
  physics(game) {
    const k = game.kernel, act = k.activeList();
    this.syncNodes(k.skills.length);
    const P = this.pos, V = this.vel;
    for (const i of act) {
      let fx = 0, fy = 0;
      for (const j of act) {
        if (i === j) continue;
        const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
        const d2 = dx * dx + dy * dy + 1e-4;
        const f = 0.00011 / d2;
        fx += dx * f; fy += dy * f;
      }
      for (const [j, w] of k.bonds[i]) {
        const dx = P[j][0] - P[i][0], dy = P[j][1] - P[i][1];
        const pull = Math.min(0.05, w * 0.002);
        fx += dx * pull; fy += dy * pull;
      }
      const t = game.today;
      if (t && t.site && t.team.includes(i)) {
        fx += (t.site.x - P[i][0]) * 0.07; fy += (t.site.y - P[i][1]) * 0.07;
      }
      fx += (0.5 - P[i][0]) * 0.022; fy += (0.70 - P[i][1]) * 0.03;
      V[i][0] = (V[i][0] + fx) * 0.82; V[i][1] = (V[i][1] + fy) * 0.82;
      P[i][0] = Math.min(0.965, Math.max(0.035, P[i][0] + V[i][0]));
      P[i][1] = Math.min(0.90, Math.max(0.55, P[i][1] + V[i][1]));
    }
  }
  px(i) { return [this.pos[i][0] * this.w, this.pos[i][1] * this.h]; }

  villagerLook(game, i) {
    const v = game.kernel.skills[i];
    const floor = Math.min(...v), max = Math.max(...v);
    let best = 0;
    for (let s = 0; s < v.length; s++) if (v[s] > v[best]) best = s;
    return {
      hue: CRAFT_HUE(best),
      sat: Math.round(Math.min(60, 8 + (max - floor) * 175) / 15) * 15,
      hair: HAIR[(i * 3 + 1) % HAIR.length],
      skin: SKIN[(i * 5 + 2) % SKIN.length],
      long: (i * 7) % 3 === 0,
    };
  }
  spriteColors(look) {
    return {
      O: OUT, E: EYE, B: BELT,

}

    `${CRAFTS[idx].icon} ${CRAFTS[idx].name} <span style="color:var(--sun)">${levelStars(s)}</span>`).join(" &nbsp; ") || "no settled livelihood yet";
  const bonds = new Map();
  for (const [j, w] of game.kernel.bonds[i]) bonds.set(j, (bonds.get(j) || 0) + w);
  for (const j of game.kernel.active) {
    const w = game.kernel.bonds[j].get(i);
    if (w) bonds.set(j, (bonds.get(j) || 0) + w);
  }
  const companions = [...bonds.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([j, w]) => `${game.vname(j)} <span class="hearts">${"♥".repeat(Math.max(1, Math.min(5, Math.round(w / 3))))}</span>`)
    .join(" &nbsp; ") || "keeps to themselves, so far";
  let circle = "";
  for (const [key, c] of game.crews) {
    if (c.name && !c.disbanded && key.split(",").map(Number).includes(i)) { circle = ` · ${c.name}`; break; }
  }
  $("villagerCard").innerHTML =
    `<img src="${renderer.portrait(look)}" alt="">` +
    `<div class="vname">${v.name}</div>` +
    `<div>${elder}${v.works} days of work · carried the day ${v.carried} times${circle}</div>` +
    `<div class="quirk">${v.quirk}</div>` +
    `<div style="margin-top:5px">${crafts}</div>` +
    `<div style="margin-top:4px">${companions}</div>`;
}
function refreshBanner() {
  const t = game.today;
  $("dayBanner").innerHTML = !t ? "The valley wakes." :
    `<span class="need">${t.title}</span> ${t.icons}<br>` +
    `<span class="party">${t.partyNames.join(", ")} answered the call…</span> ${t.outcome}`;
}
function refreshHeader() {
  const { season, dayOfSeason, year } = game.dateParts(game.kernel.round);
  $("date").textContent = `${SEASONS[season].icon} ${SEASONS[season].name} · Day ${dayOfSeason} · Year ${year}`;
  $("surplus").textContent = `🧺 ${game.surplus}`;
}
function refreshValley() {
  $("tier").textContent = `${TIERS[game.tierIdx].label} · ${game.kernel.active.size} souls`;
  const next = TIERS[game.tierIdx + 1];
  if (next) {
    const prev = TIERS[game.tierIdx].at;
    $("tierNext").textContent = `${game.flourish - prev} / ${next.at - prev} to ${next.label.toLowerCase()}`;
    $("tierBar").style.width = Math.min(100, (game.flourish - prev) / (next.at - prev) * 100) + "%";
  } else {
    $("tierNext").textContent = "the valley wants for nothing";
    $("tierBar").style.width = "100%";
  }
  $("seasonNote").textContent = SEASONS[game.season].note;
  $("tradRow").innerHTML = CRAFTS.map((c, i) =>
    `<span class="${game.kernel.traditions.has(i) ? "" : "off"}" title="${c.name}${game.kernel.traditions.has(i) ? " — a tradition of the valley" : ""}">${c.icon}</span>`).join("");
  $("handsNote").textContent = `Your hand, this past year: ${game.handsInYear()} times.`;
  const cn = $("closingNote");
  if (game.closed) { cn.hidden = false; cn.innerHTML = "✦ The valley closed over. It keeps itself now."; }
  else if (game.year() > CLOSING.minYear) {
    cn.hidden = false;
    const k = game.kernel;
    const tr = k.traditions.size, sy = Math.round(successRate(k.recent.slice(-YEAR_LEN)) * 100);
    const hy = game.handsInYear(), calls = k.taskBias.size;
    const b = (ok, s) => `<b class="${ok ? "" : "no"}">${s}</b>`;
    cn.innerHTML = `The Closing: ${b(tr >= CLOSING.traditions, tr + "/" + CLOSING.traditions + " traditions")} · ` +
      `${b(sy >= CLOSING.success * 100, sy + "% year")} · ${b(hy <= CLOSING.hands, hy + "/" + CLOSING.hands + " hands")} · ` +
      `${b(calls === 0, calls + " calls up")}`;
  } else cn.hidden = true;
}
function refreshLedger() {
  const k = game.kernel, win = k.recent.slice(-100);
  $("mSucc").textContent = win.length ? Math.round(successRate(win) * 100) + "%" : "—";
  $("mSpec").textContent = specialization(k.skills, k.active).toFixed(2);
  $("mRecur").textContent = teamRecurrence(win).toFixed(2);
  $("mExpect").textContent = Math.round(game.expectation() * 100) + "%";
}
function refreshNotes() {
  if (!game.logDirty) return;
  game.logDirty = false;
  $("notes").innerHTML = game.log.map(l => {
    const { season, dayOfSeason, year } = game.dateParts(l.day);
    return `<div class="${l.cls || ""}"><span class="d">Y${year} ${SEASONS[season].name.slice(0, 3)} ${dayOfSeason}</span>${l.html}</div>`;
  }).join("");
}
function refreshButtons() {
  const two = selected.length === 2;
  $("actHearth").disabled = !two || game.surplus < 10 || game.over;
  $("actSpace").disabled = !two || game.surplus < 8 || game.over;
  $("actTeach").disabled = game.surplus < 30 || game.over;
  $("actWelcome").disabled = game.surplus < 45 || game.over;
  $("selHint").textContent = two
    ? `${game.vname(selected[0])} and ${game.vname(selected[1])} selected.`
    : "Click two villagers to share a hearth between them, or give them space.";
}
function refreshOverlay() {
  if (!game.overDirty) return;
  game.overDirty = false;
  const ov = $("overlay");
  if (!game.over) { ov.hidden = true; return; }
  ov.hidden = false;
  const kind = game.over;
  $("ovTitle").textContent = kind === "closing" ? "The Closing" : kind === "exodus" ? "The Exodus" : "Moving On";
  $("ovSub").textContent =
    kind === "closing" ? "A full year, and they hardly thought of you. The understory has closed over." :
    kind === "exodus" ? "The last fires are banked. The clearing goes back to the birds." :
    "You leave the valley as you found it: theirs.";
  $("ovElegy").innerHTML = game.elegy();
  $("ovStay").hidden = kind === "exodus";
}

function start(newSeed) {
  seed = newSeed;
  game = new Game(seed);
  window.__game = game;   // debug/testing hook
  selected = [];
  buildChips(); refreshChips();
  game.logDirty = true; game.overDirty = true;
}

function init() {
  renderer = new Renderer($("canvas"));
  start(seed);
  window.addEventListener("resize", () => renderer.resize());
  if (window.ResizeObserver) new ResizeObserver(() => renderer.resize()).observe($("canvas"));
  renderer.resize();

  $("leave").onclick = () => { if (!game.over) game.end("leave"); };
  $("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; };
  $("ovNew").onclick = () => start(Math.floor(Math.random() * 1e6));
  $("ovStay").onclick = () => {
    if (game.over === "leave" || game.over === "closing") game.over = null;
    game.overDirty = true; $("overlay").hidden = true;
  };
  $("canvas").addEventListener("click", e => {
    const r = $("canvas").getBoundingClientRect();
    const i = renderer.hit(game, e.clientX - r.left, e.clientY - r.top);
    if (i < 0) { selected = []; refreshCard(); return; }
    if (selected.includes(i)) selected = selected.filter(x => x !== i);
    else { selected.push(i); if (selected.length > 2) selected.shift(); }
    refreshCard();
  });
  $("actHearth").onclick = () => { if (selected.length === 2) game.shareHearth(selected[0], selected[1]); };
  $("actSpace").onclick = () => { if (selected.length === 2) game.giveSpace(selected[0], selected[1]); };
  $("actTeach").onclick = () => game.teachingSeason();
  $("actWelcome").onclick = () => game.welcome();

  let acc = 0, frame = 0;
  setInterval(() => {
    if (!paused && !game.over) {
      acc += Number($("speed").value) / 20;
      while (acc >= 1) { game.day(); acc -= 1; }
    }
    selected = selected.filter(i => game.kernel.active.has(i));
    if (game.glitch) { game.glitch = false; renderer.glitchFrames = 14; }
    const rect = $("canvas").getBoundingClientRect();
    if (Math.abs(rect.width - renderer.w) > 1 || Math.abs(rect.height - renderer.h) > 1) renderer.resize();
    renderer.physics(game);
    renderer.draw(game, selected);
    frame++;
    if (frame % 5 === 0) {
      refreshHeader(); refreshValley(); refreshBanner();
      refreshButtons(); refreshChips(); refreshCard(); refreshLedger();
    }
    refreshNotes(); refreshOverlay();
  }, 50);
}
init();
</script>
</body>
</html>
