# Example experiment spec — runs fully offline via the `sim` provider.
#   python -m harness.experiment run config/experiments/example_qa.yaml
#
# It compares three "arms" on a tiny factual-QA set: a subject that always answers
# correctly, one that always answers wrong, and a 2-agent debate. Because the `sim`
# provider is deterministic, results are identical on every machine.
name: example_qa
hypothesis: "A subject that returns the correct answer scores higher exact-match than one that does not."
task_type: qa
eval_type: keyword

dataset:
  tasks:
    - input: "What is the capital of France?"
      expected: paris
    - input: "What is the chemical symbol for gold?"
      expected: au
    - input: "Who wrote Romeo and Juliet?"
      expected: shakespeare

arms:
  - name: oracle
    provider: sim
    params: { sim_response: "The answer is paris au shakespeare." }
  - name: wrong
    provider: sim
    params: { sim_response: "I do not know." }
  - name: debate
    provider: sim
    strategy: debate
    params: { n_debaters: 2, n_rounds: 1, sim_response: "paris au shakespeare" }
