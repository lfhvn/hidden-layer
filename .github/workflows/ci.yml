name: CI

on:
  push:
    branches: [ main, "claude/*" ]
  pull_request:
    branches: [ main ]

# CI mirrors `make ci` and runs fully offline (no API keys, no network): tests use the
# deterministic `sim` provider. Jobs delegate to Makefile targets so local and CI can't drift.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run offline test suites
        run: make test

      - name: Regenerate & verify bound-paper results
        run: make papers

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: Check formatting (black, isort)
        run: make format-check
      - name: Lint (flake8)
        run: make lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation files
        run: make docs
